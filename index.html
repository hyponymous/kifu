<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kifu</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="." class="wordmark"><img src="favicon.svg" alt="">kifu</a>
    <p class="tagline">Share SGF files via URL &mdash; no server, no storage</p>
    <a href="https://github.com/hyponymous/kifu" class="github-link" aria-label="GitHub repository" target="_blank" rel="noopener">
      <svg viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/></svg>
    </a>
  </header>

  <main>
    <details id="sgf-panel">
      <summary>Edit SGF</summary>
      <div id="drop-zone">
        <textarea id="sgf-input" placeholder="Paste SGF here…" spellcheck="false" autocomplete="off"></textarea>
        <div class="drop-hint">or drop a file anywhere on this box</div>
        <label class="file-label">
          Choose file
          <input type="file" id="file-input" accept=".sgf">
        </label>
      </div>
    </details>

    <div id="construct-entry">
      <button id="construct-btn">Edit position</button>
    </div>

    <div id="construct-toolbar" hidden>
      <button id="color-black" class="color-btn active">&#9679; Black</button>
      <button id="color-white" class="color-btn">&#9675; White</button>
      <button id="construct-clear">Clear</button>
      <button id="construct-close">Hide</button>
    </div>

    <div id="sharing" hidden>
      <a id="share-link" href="" target="_blank" rel="noopener" class="share-link"></a>
      <button id="copy-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>Copy</span>
      </button>
      <button id="qr-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="5" width="3" height="3"/><rect x="13" y="2" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="16" y="5" width="3" height="3"/><rect x="2" y="13" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="16" width="3" height="3"/><rect x="13" y="13" width="3" height="3"/><rect x="18" y="13" width="3" height="3"/><rect x="13" y="18" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/></svg>
        <span>QR</span>
      </button>
      <button id="download-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download SGF
      </button>
    </div>

    <p id="status" hidden>Decoding&hellip;</p>
    <div id="error" class="error" hidden></div>

    <div id="game-info" class="game-info" hidden></div>

    <div id="board"></div>
  </main>

  <div id="qr-modal" hidden>
    <div id="qr-modal-content">
      <div id="qr-display"></div>
      <button id="qr-close" aria-label="Close QR code">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <script src="qrcode.js"></script>
  <script type="module">
    import { encode }           from './encode.js';
    import { decode, download } from './decode.js';
    import { parse }            from './sgf-parser.js';
    import { renderGoban, replayMain } from './goban.js';

    const board       = document.getElementById('board');
    const gameInfo    = document.getElementById('game-info');
    const statusEl    = document.getElementById('status');
    const errorEl     = document.getElementById('error');
    const sharingEl   = document.getElementById('sharing');
    const shareLinkEl = document.getElementById('share-link');
    const downloadBtn = document.getElementById('download-btn');
    const qrModal     = document.getElementById('qr-modal');
    const qrDisplay   = document.getElementById('qr-display');
    const copyBtn     = document.getElementById('copy-btn');
    const qrBtn       = document.getElementById('qr-btn');
    const sgfPanel    = document.getElementById('sgf-panel');
    const textarea    = document.getElementById('sgf-input');
    const fileInput   = document.getElementById('file-input');
    const dropZone    = document.getElementById('drop-zone');

    let currentFilename  = 'game.sgf';
    let encodeTimer      = null;
    let constructMode    = false;
    let constructStones  = new Map(); // `${r},${c}` → 'B' | 'W'
    let constructColor   = 'B';
    let constructCols    = 19;
    let constructRows    = 19;

    const constructEntryEl   = document.getElementById('construct-entry');
    const constructToolbarEl = document.getElementById('construct-toolbar');

    // ── Init / routing ───────────────────────────────────────────────────────

    async function init() {
      board.innerHTML = '';
      gameInfo.hidden   = true;
      sharingEl.hidden  = true;
      qrModal.hidden    = true;
      errorEl.hidden    = true;
      statusEl.hidden   = true;

      if (location.hash.length > 1) {
        sgfPanel.open   = false;
        statusEl.hidden = false;
        let sgf;
        try {
          sgf = await decode(location.hash.slice(1));
        } catch (e) {
          statusEl.hidden = true;
          showError(e.message);
          return;
        }
        statusEl.hidden = true;
        textarea.value  = sgf;
        render(sgf);
        shareLinkEl.href = location.href;
        shareLinkEl.textContent = location.href;
        if (!qrModal.hidden) renderQR();
      } else {
        textarea.value = '';
        sgfPanel.open  = true;
      }
    }

    window.addEventListener('popstate', init);

    // ── Hash update (debounced) ───────────────────────────────────────────────

    function scheduleHashUpdate(sgf, push = false) {
      clearTimeout(encodeTimer);
      if (!sgf) {
        history.replaceState(null, '', location.pathname);
        shareLinkEl.href = '';
        shareLinkEl.textContent = '';
        return;
      }
      encodeTimer = setTimeout(async () => {
        try {
          const fragment = await encode(sgf);
          (push ? history.pushState : history.replaceState).call(history, null, '', '#' + fragment);
          shareLinkEl.href = location.href;
          shareLinkEl.textContent = location.href;
          if (!qrModal.hidden) renderQR();
        } catch {}
      }, 400);
    }

    async function commitHash() {
      clearTimeout(encodeTimer);
      const sgf = textarea.value.trim();
      if (!sgf) return;
      try {
        const fragment = await encode(sgf);
        history.pushState(null, '', '#' + fragment);
        shareLinkEl.href = location.href;
        shareLinkEl.textContent = location.href;
      } catch {}
    }

    // ── Render ───────────────────────────────────────────────────────────────

    function render(sgf, gobanOpts = {}) {
      errorEl.hidden = true;
      if (!sgf) {
        board.innerHTML  = '';
        gameInfo.hidden  = true;
        sharingEl.hidden = true;
        qrModal.hidden   = true;
        return;
      }

      let trees;
      try {
        trees = parse(sgf);
      } catch (e) {
        board.innerHTML  = '';
        gameInfo.hidden  = true;
        sharingEl.hidden = true;
        qrModal.hidden   = true;
        showError(e.message);
        return;
      }

      const props = trees[0].nodes[0].props;

      const lines = [
        props.GN?.[0],
        props.PB?.[0] && props.PW?.[0] && `${props.PB[0]} vs ${props.PW[0]}`,
        props.DT?.[0],
      ].filter(Boolean);

      if (lines.length) {
        gameInfo.innerHTML = lines.map(s => `<p>${esc(s)}</p>`).join('');
        gameInfo.hidden = false;
      } else {
        gameInfo.hidden = true;
      }

      const rawName   = props.GN?.[0]?.trim() || 'kifu';
      currentFilename = rawName.replace(/[/\\:*?"<>|]/g, '_').trim() + '.sgf';

      renderGoban(trees, board, gobanOpts);
      sharingEl.hidden = false;
    }

    // ── Textarea input ───────────────────────────────────────────────────────

    let isPaste = false;
    textarea.addEventListener('paste', () => { isPaste = true; });

    textarea.addEventListener('input', () => {
      if (constructMode) exitConstruct();
      const sgf = textarea.value.trim();
      const push = isPaste;
      isPaste = false;
      render(sgf);
      scheduleHashUpdate(sgf, push);
    });

    // ── Download ─────────────────────────────────────────────────────────────

    downloadBtn.addEventListener('click', async () => {
      await commitHash();
      download(textarea.value.trim(), currentFilename);
    });

    // ── QR code ───────────────────────────────────────────────────────────────

    function renderQR() {
      const url = shareLinkEl.href;
      if (!url) { qrDisplay.innerHTML = ''; return; }
      try {
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        qrDisplay.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
      } catch {
        qrDisplay.innerHTML = '';
      }
    }

    copyBtn.addEventListener('click', async () => {
      await commitHash();
      const textEl = copyBtn.querySelector('span');
      navigator.clipboard.writeText(shareLinkEl.href).then(() => {
        textEl.textContent = 'Copied!';
        setTimeout(() => { textEl.textContent = 'Copy'; }, 2000);
      });
    });

    qrBtn.addEventListener('click', async () => {
      await commitHash();
      qrModal.hidden = false;
      renderQR();
    });

    document.getElementById('qr-close').addEventListener('click', () => {
      qrModal.hidden = true;
    });

    qrModal.addEventListener('click', e => {
      if (e.target === qrModal) qrModal.hidden = true;
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !qrModal.hidden) qrModal.hidden = true;
    });

    // ── File picker ───────────────────────────────────────────────────────────

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) readFile(fileInput.files[0]);
    });

    // ── Drag-and-drop ─────────────────────────────────────────────────────────

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    ['dragleave', 'drop'].forEach(evt =>
      dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover'))
    );
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
    });

    function readFile(file) {
      const reader = new FileReader();
      reader.onload = e => {
        textarea.value = e.target.result;
        sgfPanel.open  = true;
        const sgf = textarea.value.trim();
        render(sgf);
        scheduleHashUpdate(sgf, true);
      };
      reader.readAsText(file);
    }

    // ── Utilities ─────────────────────────────────────────────────────────────

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
    }

    function flash(btn, label, reset) {
      btn.textContent = label;
      setTimeout(() => { btn.textContent = reset; }, 2000);
    }

    function esc(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // ── Construct mode ────────────────────────────────────────────────────────

    function treeHasMoves(tree) {
      for (const node of tree.nodes) {
        if (node.props.B !== undefined || node.props.W !== undefined) return true;
      }
      return tree.variations.some(v => treeHasMoves(v));
    }

    function generateConstructSGF() {
      const ab = [], aw = [];
      for (const [key, color] of constructStones) {
        const [r, c] = key.split(',').map(Number);
        const coord = String.fromCharCode(97 + c) + String.fromCharCode(97 + r);
        (color === 'B' ? ab : aw).push(`[${coord}]`);
      }
      const sz = constructCols === constructRows ? constructCols : `${constructCols}:${constructRows}`;
      let p = `SZ[${sz}]`;
      if (ab.length) p += `AB${ab.join('')}`;
      if (aw.length) p += `AW${aw.join('')}`;
      return `(;${p})`;
    }

    function renderConstruct() {
      const sgf = generateConstructSGF();
      textarea.value = sgf;
      render(sgf, { forceFullBoard: true, onClick: onBoardClick, jitter: 0 });
      scheduleHashUpdate(sgf);
    }

    function onBoardClick(r, c) {
      const key = `${r},${c}`;
      if (constructStones.get(key) === constructColor) {
        constructStones.delete(key);
      } else {
        constructStones.set(key, constructColor);
      }
      renderConstruct();
    }

    function enterConstruct() {
      const sgf = textarea.value.trim();
      if (sgf) {
        let trees;
        try { trees = parse(sgf); } catch { return; }
        const tree = trees[0];
        const rootProps = tree.nodes[0]?.props ?? {};
        const szProp = rootProps.SZ?.[0] ?? '19';
        if (szProp.includes(':')) {
          const parts = szProp.split(':');
          constructCols = parseInt(parts[0], 10);
          constructRows = parseInt(parts[1], 10);
        } else {
          constructCols = constructRows = parseInt(szProp, 10) || 19;
        }
        if (treeHasMoves(tree) && !confirm('This will remove all moves, keeping only the current board position. Continue?')) {
          return;
        }
        const boardState = new Int8Array(constructCols * constructRows);
        replayMain(boardState, constructCols, constructRows, tree);
        constructStones.clear();
        for (let r = 0; r < constructRows; r++) {
          for (let c = 0; c < constructCols; c++) {
            const v = boardState[r * constructCols + c];
            if (v === 1) constructStones.set(`${r},${c}`, 'B');
            else if (v === -1) constructStones.set(`${r},${c}`, 'W');
          }
        }
      } else {
        constructCols = constructRows = 19;
        constructStones.clear();
      }
      constructMode = true;
      constructEntryEl.hidden   = true;
      constructToolbarEl.hidden = false;
      sgfPanel.open = false;
      renderConstruct();
    }

    function exitConstruct() {
      constructMode = false;
      constructEntryEl.hidden   = false;
      constructToolbarEl.hidden = true;
      render(textarea.value);
    }

    document.getElementById('construct-btn').addEventListener('click', enterConstruct);
    document.getElementById('construct-close').addEventListener('click', exitConstruct);
    document.getElementById('construct-clear').addEventListener('click', () => {
      constructStones.clear();
      renderConstruct();
    });

    const colorBtns = document.querySelectorAll('.color-btn');
    document.getElementById('color-black').addEventListener('click', () => {
      constructColor = 'B';
      colorBtns.forEach(b => b.classList.remove('active'));
      document.getElementById('color-black').classList.add('active');
    });
    document.getElementById('color-white').addEventListener('click', () => {
      constructColor = 'W';
      colorBtns.forEach(b => b.classList.remove('active'));
      document.getElementById('color-white').classList.add('active');
    });

    init();
  </script>
</body>
</html>
