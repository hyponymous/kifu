<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fixture editor</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: monospace; background: #111; color: #ccc; margin: 0; padding: 1rem; }
    h1 { font-size: 1rem; margin: 0 0 0.75rem 0; color: #eee; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.6rem; }
    button { background: #222; border: 1px solid #444; color: #ccc; padding: 0.3rem 0.65rem; cursor: pointer; font: inherit; }
    button:hover:not(:disabled) { background: #333; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    label.file-btn { background: #222; border: 1px solid #444; color: #ccc; padding: 0.3rem 0.65rem; cursor: pointer; font: inherit; }
    label.file-btn:hover { background: #333; }
    .param { display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; color: #aaa; }
    .param input[type="number"] { width: 3.2em; font: inherit; background: #222; border: 1px solid #444; color: #ccc; padding: 0.2rem 0.3rem; text-align: center; }
    #status { font-size: 0.78rem; color: #777; margin: 0.2rem 0 0.75rem; min-height: 1.2em; }
    canvas { display: block; border: 1px solid #222; background: #000; }
    #canvas-input { max-width: 720px; touch-action: none; }
    #board-canvas { cursor: pointer; margin-top: 0.5rem; }
    .tool-btn.active { background: #3a3a5a; border-color: #7c5cbf; color: #ddf; }
    #metrics { font-size: 0.78rem; color: #777; margin: 0 0 0.4rem; min-height: 1.2em; }
    #fixture-out { background: #0a0a0a; border: 1px solid #2a2a2a; padding: 0.5rem; font-size: 0.72rem; color: #7d7; white-space: pre-wrap; word-break: break-all; max-height: 12rem; overflow-y: auto; margin-top: 0.3rem; }
    .stages { display: flex; gap: 1rem; flex-wrap: wrap; }
    .stage { }
    .stage-label { font-size: 0.7rem; color: #555; margin-bottom: 0.2rem; }
  </style>
</head>
<body>
  <h1>fixture editor</h1>
  <div id="status">Loading OpenCV.js…</div>

  <div class="row">
    <label class="file-btn">Open image <input type="file" id="file-input" accept="image/*" hidden></label>
    <button id="run-btn" disabled>Run Pipeline</button>
    <span class="param">
      <label><input type="checkbox" id="auto-dims" checked> auto dims</label>
    </span>
    <span class="param">
      <label>Rows</label>
      <input type="number" id="board-rows" min="2" max="25" placeholder="auto">
    </span>
    <span class="param">
      <label>Cols</label>
      <input type="number" id="board-cols" min="2" max="25" placeholder="auto">
    </span>
    <span id="detected-dims" style="font-size:0.78rem;color:#888"></span>
  </div>

  <div class="row">
    <button id="copy-fixture-btn" disabled>Copy Fixture</button>
    <button id="paste-fixture-btn">Paste Fixture</button>
  </div>

  <div class="row">
    <button id="tool-move" class="tool-btn active">Move</button>
    <button id="tool-fit" class="tool-btn">Fit</button>
    <button id="tool-lens" class="tool-btn">Lens</button>
    <span style="color:#444; margin:0 0.1rem;">|</span>
    <button id="pin-corners-btn">Pin Corners</button>
    <button id="reset-dots-btn">Reset</button>
    <button id="lens-apply-btn" hidden>Apply → Fit</button>
    <button id="lens-reset-btn" hidden>Reset Lens</button>
    <span style="color:#444; margin:0 0.1rem;">|</span>
    <button id="toggle-dumbbells" class="tool-btn">Dumbbells</button>
    <button id="toggle-ellipses" class="tool-btn">Ellipses</button>
    <span class="param" id="thickness-param" style="display:none">
      <label for="stone-thickness">thickness</label>
      <input type="range" id="stone-thickness" min="0" max="1" step="0.02" value="0.3" style="width:80px">
      <span id="stone-thickness-val" style="min-width:2.2em">0.30</span>
    </span>
  </div>

  <div id="metrics"></div>

  <div class="stages">
    <div class="stage">
      <div class="stage-label">input</div>
      <canvas id="canvas-input"></canvas>
    </div>
    <div class="stage">
      <div class="stage-label">board</div>
      <canvas id="board-canvas"></canvas>
    </div>
  </div>

  <pre id="fixture-out" hidden></pre>

  <script>
    var Module = {
      onRuntimeInitialized() {
        document.getElementById('status').textContent = 'OpenCV ready.';
        document.getElementById('run-btn').disabled = false;
      }
    };
  </script>
  <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>

  <script type="module">
    import {
      classifyStones, enhanceGray, rectifyBoard,
      buildDetectionFromGrid, fitTPS, evalTPS,
    } from '../photo-pipeline';
    import { runPipeline as sharedRunPipeline } from '../run-pipeline';
    import { MatScope } from '../mat-scope';

    const el = id => document.getElementById(id);

    const canvasInput = el('canvas-input');
    const ctxInput    = canvasInput.getContext('2d');
    const boardCanvas = el('board-canvas');
    const ctxBoard    = boardCanvas.getContext('2d');

    let imageLoaded = false;
    let currentFilename = '';
    // Project-root-relative image path for the fixture JSON (e.g. fixtures/real/IMG_1395.JPG).
    // Resolved by probing /kifu/fixtures/ and /kifu/fixtures/real/ after image load.
    let currentImagePath = '';
    let nRows = 0, nCols = 0;
    let editableStones = null; // 2D array [r][c] = 'B' | 'W' | '.'
    let lastRectCorners = null;
    let lastRectW = 0, lastRectH = 0;

    // Source image for redrawing under dots
    let sourceImage = null; // HTMLImageElement
    let sourceW = 0, sourceH = 0;

    // Input dots: flat array of {x, y, r, c} in original image coords
    let inputDots = null;

    // Viewport state for pan/zoom on input canvas
    let viewport = { scale: 1, panX: 0, panY: 0 };

    // Tab-zoom cycling state
    let tabZoomIndex = -1; // -1 = zoomed out, 0..N-1 = index into sorted pin list

    // Dumbbell overlay toggle
    let showDumbbells = false;
    // Ellipse overlay toggle
    let showEllipses = false;
    let stoneThickness = 0.3;

    // Ellipse editing state
    /** @type {string | null} */ let selectedEllipseKey = null;  // "r,c" or null
    /** @type {string | null} */ let ellipseDragMode = null;     // 'center' | 'majorA' | 'majorB' | 'minorA' | 'minorB' | null
    /** @type {{ [key: string]: { dcx?: number, dcy?: number, da?: number, db?: number, dangle?: number } }} */
    let ellipseOverrides = {};  // per-ellipse manual adjustments (deltas from computed)

    // ── Lens tool state ───────────────────────────────────────────────────
    let lensCorners = [];         // 4 points [{x,y}, ...] — board corners in image space
    let lensDragging = null;      // 'corner-0'..'corner-3' or null
    let lastFocusPoint = null;    // {x,y} in image coords — last clicked/dragged handle

    // ── Resolve project-root-relative image path ────────────────────────────
    // Probes /kifu/fixtures/ and /kifu/fixtures/real/ to find where the image
    // actually lives in the repo, so the fixture JSON stores the correct path.
    async function resolveImagePath(filename) {
      for (const dir of ['fixtures/real', 'fixtures']) {
        try {
          const r = await fetch(`/kifu/${dir}/${filename}`, { method: 'HEAD' });
          if (r.ok) return `${dir}/${filename}`;
        } catch {}
      }
      return `fixtures/real/${filename}`; // best-guess default for new real photos
    }

    // ── Lens math ──────────────────────────────────────────────────────────

    /** Compute 3x3 homography from 4 source points to 4 dest points using OpenCV */
    function computeHomography(srcQuad, dstQuad) {
      const src = cv.matFromArray(4, 1, cv.CV_32FC2,
        srcQuad.flatMap(p => [p.x, p.y]));
      const dst = cv.matFromArray(4, 1, cv.CV_32FC2,
        dstQuad.flatMap(p => [p.x, p.y]));
      const M = cv.getPerspectiveTransform(src, dst);
      /** @type {Float64Array} */
      const H = new Float64Array(9);
      for (let i = 0; i < 9; i++) H[i] = M.doubleAt(Math.floor(i / 3), i % 3);
      src.delete(); dst.delete(); M.delete();
      return H;
    }

    /** Apply 3x3 homography to a point */
    function applyHomography(H, x, y) {
      const w = H[6] * x + H[7] * y + H[8];
      return {
        x: (H[0] * x + H[1] * y + H[2]) / w,
        y: (H[3] * x + H[4] * y + H[5]) / w,
      };
    }

    /**
     * Lens model: board grid (r,c) → image position via homography.
     * Requires lensCorners.length === 4.
     */
    function lensModelPoint(r, c) {
      const u = nCols > 1 ? c / (nCols - 1) : 0.5;
      const v = nRows > 1 ? r / (nRows - 1) : 0.5;
      const unitSquare = [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 1, y: 1 }, { x: 0, y: 1 }];
      const H = computeHomography(unitSquare, lensCorners);
      return applyHomography(H, u, v);
    }

    /**
     * Compute predicted stone ellipses from the lens homography.
     * For each stone, uses the local Jacobian of H (unit-square → image) to
     * transform a circle of radius gridStep/2 into an ellipse, then shifts
     * the center by parallax based on stoneThickness.
     * Returns object keyed by "r,c" with {cx, cy, a, b, angle}.
     */
    function computeStoneEllipses(thickness) {
      if (lensCorners.length !== 4 || !editableStones || nRows < 2 || nCols < 2) return null;
      const unitSquare = [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 1, y: 1 }, { x: 0, y: 1 }];
      const H = computeHomography(unitSquare, lensCorners);

      // Grid step in unit-square coords
      const du = 1 / (nCols - 1);
      const dv = 1 / (nRows - 1);
      // Stone radius in unit-square coords (half a grid step, average of both dirs)
      const stoneR = (du + dv) / 4;

      const eps = 0.001;  // for numerical Jacobian
      const result = {};

      for (let r = 0; r < nRows; r++) {
        for (let c = 0; c < nCols; c++) {
          if (editableStones[r][c] === '.') continue;

          const u = c / (nCols - 1);
          const v = r / (nRows - 1);
          const center = applyHomography(H, u, v);

          // Numerical Jacobian: J = [∂img/∂u, ∂img/∂v] (2×2)
          const pu = applyHomography(H, u + eps, v);
          const pv = applyHomography(H, u, v + eps);
          const J = [
            [(pu.x - center.x) / eps, (pv.x - center.x) / eps],
            [(pu.y - center.y) / eps, (pv.y - center.y) / eps],
          ];

          // A circle of radius stoneR in (u,v) space maps to an ellipse in image space.
          // The ellipse axes are the singular values of J (times stoneR), and the
          // orientation comes from the LEFT singular vectors — eigenvectors of J·Jᵀ.
          const JJt = [
            [J[0][0] * J[0][0] + J[0][1] * J[0][1], J[0][0] * J[1][0] + J[0][1] * J[1][1]],
            [J[1][0] * J[0][0] + J[1][1] * J[0][1], J[1][0] * J[1][0] + J[1][1] * J[1][1]],
          ];

          // Eigenvalues of 2×2 symmetric matrix
          const avg = (JJt[0][0] + JJt[1][1]) / 2;
          const diff = (JJt[0][0] - JJt[1][1]) / 2;
          const disc = Math.sqrt(diff * diff + JJt[0][1] * JJt[0][1]);
          const lam1 = avg + disc;  // larger eigenvalue
          const lam2 = avg - disc;  // smaller eigenvalue
          if (lam1 <= 0 || lam2 <= 0) continue;

          const a = stoneR * Math.sqrt(lam1);  // semi-major
          const b = stoneR * Math.sqrt(lam2);  // semi-minor
          // Eigenvector for lam1 → angle of major axis in image space
          const angle = Math.atan2(JJt[0][1], lam1 - JJt[1][1]) * 180 / Math.PI;

          // Parallax shift: stone top is elevated, appears shifted toward camera.
          // Same logic as proto-photo correctEllipseParallax but reversed direction
          // (from board position → apparent position, not the other way).
          let cx = center.x, cy = center.y;
          const ratio = b / a;
          if (ratio < 0.95 && thickness > 0) {
            const shiftMag = 2 * thickness * a * Math.sqrt(1 - ratio * ratio);
            const angleRad = angle * Math.PI / 180;
            const mx = -Math.sin(angleRad);
            const my = Math.cos(angleRad);
            // Shift upward in image space (toward camera = -y)
            const sign = my > 0 ? -1 : 1;
            cx += shiftMag * mx * sign;
            cy += shiftMag * my * sign;
          }

          result[`${r},${c}`] = {
            cx: Math.round(cx * 10) / 10,
            cy: Math.round(cy * 10) / 10,
            a: Math.round(a * 10) / 10,
            b: Math.round(b * 10) / 10,
            angle: Math.round(angle * 10) / 10,
          };
        }
      }
      return result;
    }

    /** Get the effective ellipse for a key, with manual overrides applied */
    function getEffectiveEllipse(key, baseEllipses) {
      const base = baseEllipses[key];
      if (!base) return null;
      const ov = ellipseOverrides[key];
      if (!ov) return base;
      return {
        cx: base.cx + (ov.dcx || 0),
        cy: base.cy + (ov.dcy || 0),
        a: base.a + (ov.da || 0),
        b: base.b + (ov.db || 0),
        angle: base.angle + (ov.dangle || 0),
      };
    }

    /** Get all effective ellipses (computed + overrides) */
    function getEffectiveEllipses() {
      const base = computeStoneEllipses(stoneThickness);
      if (!base) return null;
      const result = {};
      for (const key of Object.keys(base)) {
        result[key] = getEffectiveEllipse(key, base);
      }
      return result;
    }

    /**
     * Hit-test ellipse handles and body. Returns:
     * { key, mode: 'center'|'majorA'|'majorB'|'minorA'|'minorB'|'body' } or null
     */
    function hitTestEllipses(ix, iy) {
      if (!showEllipses || lensCorners.length !== 4) return null;
      const ellipses = getEffectiveEllipses();
      if (!ellipses) return null;

      const handleR = Math.max(8, sourceW / 80) / viewport.scale;

      // If there's a selected ellipse, check its handles first
      if (selectedEllipseKey && ellipses[selectedEllipseKey]) {
        const ell = ellipses[selectedEllipseKey];
        const rad = ell.angle * Math.PI / 180;
        const cosA = Math.cos(rad), sinA = Math.sin(rad);

        // Handle positions: center, major axis tips (±a), minor axis tips (±b)
        const handles = [
          { mode: 'center', hx: ell.cx, hy: ell.cy },
          { mode: 'majorA', hx: ell.cx + ell.a * cosA, hy: ell.cy + ell.a * sinA },
          { mode: 'majorB', hx: ell.cx - ell.a * cosA, hy: ell.cy - ell.a * sinA },
          { mode: 'minorA', hx: ell.cx - ell.b * sinA, hy: ell.cy + ell.b * cosA },
          { mode: 'minorB', hx: ell.cx + ell.b * sinA, hy: ell.cy - ell.b * cosA },
        ];
        for (const h of handles) {
          if (Math.hypot(ix - h.hx, iy - h.hy) < handleR) {
            return { key: selectedEllipseKey, mode: h.mode };
          }
        }
      }

      // Check ellipse bodies (point-in-ellipse test)
      let bestKey = null, bestDist = Infinity;
      for (const [key, ell] of Object.entries(ellipses)) {
        const dx = ix - ell.cx, dy = iy - ell.cy;
        const rad = ell.angle * Math.PI / 180;
        const cosA = Math.cos(rad), sinA = Math.sin(rad);
        const lx = dx * cosA + dy * sinA;
        const ly = -dx * sinA + dy * cosA;
        const norm = (lx / ell.a) ** 2 + (ly / ell.b) ** 2;
        if (norm <= 1.2) {  // slightly generous hit area
          const dist = Math.hypot(dx, dy);
          if (dist < bestDist) { bestDist = dist; bestKey = key; }
        }
      }
      if (bestKey) return { key: bestKey, mode: 'body' };
      return null;
    }

    /** Reset all lens state */
    function resetLens() {
      lensCorners = [];
      lensDragging = null;
      ellipseOverrides = {};
      selectedEllipseKey = null;
    }

    // ── Load image ──────────────────────────────────────────────────────────
    function loadImage(file, { autoRun = false } = {}) {
      currentFilename = file.name;
      currentImagePath = '';
      resolveImagePath(file.name).then(p => { currentImagePath = p; });
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const maxW = 4032, maxH = 4032;
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxW / w, maxH / h);
        w = Math.round(w * scale); h = Math.round(h * scale);
        canvasInput.width = w; canvasInput.height = h;
        sourceImage = img;
        sourceW = w; sourceH = h;
        inputDots = null;
        pipelineDots = null;
        pinnedDots.clear();
        lastFit = null;
        resetLens();
        lastRectCorners = null;
        lastRectW = 0; lastRectH = 0;
        el('board-rows').value = '';
        el('board-cols').value = '';
        el('auto-dims').checked = true;
        syncAutoDims();
        el('detected-dims').textContent = '';
        viewport = { scale: 1, panX: 0, panY: 0 };
        setActiveTool('move');
        drawInputCanvas();
        imageLoaded = true;
        el('status').textContent = `Loaded ${currentFilename} (${w}×${h})`;
        if (autoRun) runPipeline();
      };
      img.src = url;
    }

    el('file-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) loadImage(file);
    });

    // ── Draw input canvas (image + dots + grid curves) ──────────────────────
    function drawInputCanvas() {
      if (!sourceImage) return;
      const ctx = ctxInput;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvasInput.width, canvasInput.height);
      ctx.setTransform(viewport.scale, 0, 0, viewport.scale, viewport.panX, viewport.panY);
      ctx.drawImage(sourceImage, 0, 0, sourceW, sourceH);

      // Draw fitted grid curves in fit mode
      if (activeTool === 'fit' && lastFit && inputDots) {
        const steps = 50;
        ctx.strokeStyle = 'rgba(160, 140, 240, 0.55)';
        ctx.lineWidth = 2 / viewport.scale;
        // Row curves
        for (let r = 0; r < nRows; r++) {
          ctx.beginPath();
          for (let s = 0; s <= steps; s++) {
            const c = s * (nCols - 1) / steps;
            const { x: px, y: py } = evalGridFit(r, c);
            if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
        // Column curves
        for (let c = 0; c < nCols; c++) {
          ctx.beginPath();
          for (let s = 0; s <= steps; s++) {
            const r = s * (nRows - 1) / steps;
            const { x: px, y: py } = evalGridFit(r, c);
            if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
      }

      // Lens tool overlay
      if (activeTool === 'lens') {
        const handleR = Math.max(8, sourceW / 60) / viewport.scale;
        const lineW = Math.max(1.5, sourceW / 400) / viewport.scale;

        // Draw corner handles
        const cornerColors = ['#f44', '#f80', '#0af', '#0c6'];
        for (let i = 0; i < lensCorners.length; i++) {
          const p = lensCorners[i];
          ctx.beginPath();
          ctx.arc(p.x, p.y, handleR, 0, 2 * Math.PI);
          ctx.fillStyle = cornerColors[i];
          ctx.globalAlpha = 0.7;
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.strokeStyle = cornerColors[i];
          ctx.lineWidth = lineW;
          ctx.stroke();
        }

        // Draw grid + midpoint handles after 4 corners placed
        if (lensCorners.length === 4 && nRows >= 2 && nCols >= 2) {
          // Grid lines via lens model
          const steps = 40;
          ctx.strokeStyle = 'rgba(220, 200, 80, 0.7)';
          ctx.lineWidth = Math.max(2.5, sourceW / 300) / viewport.scale;
          // Row curves
          for (let r = 0; r < nRows; r++) {
            ctx.beginPath();
            for (let s = 0; s <= steps; s++) {
              const c = s * (nCols - 1) / steps;
              const p = lensModelPoint(r, c);
              if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
          }
          // Column curves
          for (let c = 0; c < nCols; c++) {
            ctx.beginPath();
            for (let s = 0; s <= steps; s++) {
              const r = s * (nRows - 1) / steps;
              const p = lensModelPoint(r, c);
              if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
          }

        }
      }

      // Dumbbell overlay: pipeline → current position
      if (showDumbbells && pipelineDots && inputDots) {
        const baseDotRadius = Math.max(6, sourceW / 80);
        const smallR = (baseDotRadius / viewport.scale) * 0.4;
        ctx.lineWidth = Math.max(1, sourceW / 600) / viewport.scale;
        for (let i = 0; i < inputDots.length; i++) {
          const cur = inputDots[i];
          const pip = pipelineDots[i];
          const dist = Math.hypot(cur.x - pip.x, cur.y - pip.y);
          const t = Math.min(dist / 15, 1);
          const r = Math.round(t < 0.5 ? t * 2 * 255 : 255);
          const g = Math.round(t < 0.5 ? 255 : (1 - t) * 2 * 255);
          const color = `rgb(${r},${g},0)`;
          ctx.strokeStyle = color;
          ctx.beginPath();
          ctx.moveTo(pip.x, pip.y);
          ctx.lineTo(cur.x, cur.y);
          ctx.stroke();
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(pip.x, pip.y, smallR, 0, 2 * Math.PI);
          ctx.fill();
        }
      }

      if (inputDots && activeTool !== 'lens') {
        const baseDotRadius = Math.max(6, sourceW / 80);
        const dotRadius = baseDotRadius / viewport.scale;
        ctx.lineWidth = Math.max(1, sourceW / 600) / viewport.scale;
        for (let i = 0; i < inputDots.length; i++) {
          const dot = inputDots[i];
          const pinned = pinnedDots.has(i);
          if (activeTool === 'fit' && pinned) {
            // Draw square for pinned dots (only visible in fit mode)
            const half = dotRadius * 0.85;
            ctx.fillStyle = 'rgba(124, 92, 191, 0.7)';
            ctx.strokeStyle = 'rgba(160, 130, 220, 0.9)';
            ctx.fillRect(dot.x - half, dot.y - half, half * 2, half * 2);
            ctx.strokeRect(dot.x - half, dot.y - half, half * 2, half * 2);
          } else {
            // Draw circle for unpinned dots (or all dots in move mode)
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, dotRadius, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(0, 200, 80, 0.55)';
            ctx.strokeStyle = 'rgba(0, 255, 100, 0.8)';
            ctx.fill();
            ctx.stroke();
          }
        }
      }

      // Ellipse overlay
      if (showEllipses && lensCorners.length === 4) {
        const ellipses = getEffectiveEllipses();
        if (ellipses) {
          const lineW = Math.max(1.5, sourceW / 400) / viewport.scale;
          ctx.lineWidth = lineW;
          for (const [key, ell] of Object.entries(ellipses)) {
            const [r, c] = key.split(',').map(Number);
            const color = editableStones[r][c];
            const isSelected = key === selectedEllipseKey;
            const hasOverride = !!ellipseOverrides[key];
            ctx.strokeStyle = isSelected
              ? '#fff'
              : hasOverride
                ? (color === 'B' ? 'rgba(100, 220, 255, 1)' : 'rgba(255, 220, 100, 1)')
                : (color === 'B' ? 'rgba(80, 180, 255, 0.8)' : 'rgba(255, 180, 80, 0.8)');
            ctx.lineWidth = isSelected ? lineW * 2 : lineW;
            ctx.save();
            ctx.translate(ell.cx, ell.cy);
            ctx.rotate(ell.angle * Math.PI / 180);
            ctx.beginPath();
            ctx.ellipse(0, 0, ell.a, ell.b, 0, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.restore();
          }

          // Draw handles for selected ellipse
          if (selectedEllipseKey && ellipses[selectedEllipseKey]) {
            const ell = ellipses[selectedEllipseKey];
            const rad = ell.angle * Math.PI / 180;
            const cosA = Math.cos(rad), sinA = Math.sin(rad);
            const hr = Math.max(5, sourceW / 120) / viewport.scale;

            const handles = [
              { hx: ell.cx, hy: ell.cy, fill: '#fff' },  // center
              { hx: ell.cx + ell.a * cosA, hy: ell.cy + ell.a * sinA, fill: '#f44' },  // major A
              { hx: ell.cx - ell.a * cosA, hy: ell.cy - ell.a * sinA, fill: '#f44' },  // major B
              { hx: ell.cx - ell.b * sinA, hy: ell.cy + ell.b * cosA, fill: '#4f4' },  // minor A
              { hx: ell.cx + ell.b * sinA, hy: ell.cy - ell.b * cosA, fill: '#4f4' },  // minor B
            ];
            for (const h of handles) {
              ctx.beginPath();
              ctx.arc(h.hx, h.hy, hr, 0, 2 * Math.PI);
              ctx.fillStyle = h.fill;
              ctx.globalAlpha = 0.8;
              ctx.fill();
              ctx.globalAlpha = 1;
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = lineW;
              ctx.stroke();
            }
          }
        }
      }

      ctx.restore();
    }

    // ── Coordinate conversion ───────────────────────────────────────────────
    function screenToImage(sx, sy) {
      const rect = canvasInput.getBoundingClientRect();
      const cssToCanvas = canvasInput.width / rect.width;
      const cx = (sx - rect.left) * cssToCanvas;
      const cy = (sy - rect.top) * cssToCanvas;
      return {
        x: (cx - viewport.panX) / viewport.scale,
        y: (cy - viewport.panY) / viewport.scale,
      };
    }

    function findNearestDot(ix, iy) {
      if (!inputDots) return -1;
      const hitRadius = Math.max(6, sourceW / 80) / viewport.scale;
      let bestIdx = -1, bestDist = hitRadius;
      for (let i = 0; i < inputDots.length; i++) {
        const d = Math.hypot(inputDots[i].x - ix, inputDots[i].y - iy);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      return bestIdx;
    }

    // ── Tool & pin state ────────────────────────────────────────────────────
    let activeTool = 'move'; // 'move' | 'fit' | 'lens'
    let pinnedDots = new Set(); // indices into inputDots
    let lastFit = null; // { coeffsX, coeffsY, degree } or null

    // Pipeline-output dot positions for Reset
    let pipelineDots = null; // array of {x, y, r, c} snapshot

    // ── TPS grid fitting ───────────────────────────────────────────────────
    // Two TPS models: (r,c) → imageX and (r,c) → imageY
    // fitTPS expects [{x, y, target}] where x,y are inputs, target is output.
    // We use r→x, c→y in TPS coordinate space (grid coords as input).

    function fitGridTPS() {
      if (!inputDots || pinnedDots.size < 3) { lastFit = null; return; }
      const lambda = 0.001;

      const ptsX = []; // for predicting image-X from (r,c)
      const ptsY = []; // for predicting image-Y from (r,c)
      for (const idx of pinnedDots) {
        const dot = inputDots[idx];
        ptsX.push({ x: dot.r, y: dot.c, target: dot.x });
        ptsY.push({ x: dot.r, y: dot.c, target: dot.y });
      }

      const tpsX = fitTPS(ptsX, lambda);
      const tpsY = fitTPS(ptsY, lambda);
      if (!tpsX || !tpsY) { lastFit = null; return; }

      lastFit = { tpsX, tpsY };
    }

    function evalGridFit(r, c) {
      const { tpsX, tpsY } = lastFit;
      return { x: evalTPS(tpsX, r, c), y: evalTPS(tpsY, r, c) };
    }

    function applyFit() {
      if (!lastFit || !inputDots) return;
      for (let i = 0; i < inputDots.length; i++) {
        if (pinnedDots.has(i)) continue;
        const dot = inputDots[i];
        const { x, y } = evalGridFit(dot.r, dot.c);
        dot.x = x;
        dot.y = y;
      }
    }

    function refitAndRedraw({ reclassify = false } = {}) {
      fitGridTPS();
      applyFit();
      drawInputCanvas();
      if (reclassify) {
        runPipeline({ forcedGrid: inputDots });
      } else {
        updateMetrics();
      }
    }

    // ── Metrics display ──────────────────────────────────────────────────────
    function updateMetrics() {
      const metricsEl = el('metrics');
      if (!inputDots || !editableStones) {
        metricsEl.textContent = '';
        return;
      }
      // Stone counts
      let bCount = 0, wCount = 0;
      for (const row of editableStones) {
        for (const s of row) {
          if (s === 'B') bCount++;
          else if (s === 'W') wCount++;
        }
      }
      // Displacement stats (only when both arrays match)
      if (pipelineDots && pipelineDots.length === inputDots.length) {
        let sum = 0, max = 0;
        for (let i = 0; i < inputDots.length; i++) {
          const d = Math.hypot(inputDots[i].x - pipelineDots[i].x, inputDots[i].y - pipelineDots[i].y);
          sum += d;
          if (d > max) max = d;
        }
        const mean = sum / inputDots.length;
        metricsEl.textContent = `B:${bCount} W:${wCount} · mean Δ ${mean.toFixed(1)}px max ${max.toFixed(1)}px`;
      } else {
        metricsEl.textContent = `B:${bCount} W:${wCount}`;
      }
    }

    // ── Tool palette ─────────────────────────────────────────────────────────
    function setActiveTool(tool, { refit = true } = {}) {
      activeTool = tool;
      el('tool-move').classList.toggle('active', tool === 'move');
      el('tool-fit').classList.toggle('active', tool === 'fit');
      el('tool-lens').classList.toggle('active', tool === 'lens');
      el('lens-apply-btn').hidden = tool !== 'lens';
      el('lens-reset-btn').hidden = tool !== 'lens';
      if (refit && tool === 'fit' && pinnedDots.size >= 3) refitAndRedraw();
      else drawInputCanvas();
    }

    el('tool-move').addEventListener('click', () => setActiveTool('move'));
    el('tool-fit').addEventListener('click', () => {
      setActiveTool('fit');
      if (pinnedDots.size >= 3) runPipeline({ forcedGrid: inputDots });
    });

    el('tool-lens').addEventListener('click', () => {
      if (lensCorners.length === 0 && sourceImage && nRows >= 2 && nCols >= 2) {
        // Auto-place corners at board extent (from inputDots or image margins)
        let x0, y0, x1, y1;
        if (inputDots && inputDots.length > 0) {
          x0 = Infinity; y0 = Infinity; x1 = -Infinity; y1 = -Infinity;
          for (const d of inputDots) {
            if (d.r === 0 && d.c === 0) { x0 = d.x; y0 = d.y; }
            if (d.r === 0 && d.c === nCols - 1) { x1 = Math.max(x1, d.x); y0 = Math.min(y0, d.y); }
            if (d.r === nRows - 1 && d.c === nCols - 1) { x1 = Math.max(x1, d.x); y1 = Math.max(y1, d.y); }
            if (d.r === nRows - 1 && d.c === 0) { x0 = Math.min(x0, d.x); y1 = Math.max(y1, d.y); }
          }
          // Use actual corner dot positions
          const tl = inputDots.find(d => d.r === 0 && d.c === 0);
          const tr = inputDots.find(d => d.r === 0 && d.c === nCols - 1);
          const br = inputDots.find(d => d.r === nRows - 1 && d.c === nCols - 1);
          const bl = inputDots.find(d => d.r === nRows - 1 && d.c === 0);
          if (tl && tr && br && bl) {
            lensCorners = [
              { x: tl.x, y: tl.y }, { x: tr.x, y: tr.y },
              { x: br.x, y: br.y }, { x: bl.x, y: bl.y },
            ];
          }
        }
        if (lensCorners.length === 0) {
          const m = 0.05;
          lensCorners = [
            { x: sourceW * m, y: sourceH * m }, { x: sourceW * (1 - m), y: sourceH * m },
            { x: sourceW * (1 - m), y: sourceH * (1 - m) }, { x: sourceW * m, y: sourceH * (1 - m) },
          ];
        }
      }
      setActiveTool('lens');
      el('status').textContent = 'Lens: drag corners to match board.';
    });

    el('lens-reset-btn').addEventListener('click', () => {
      resetLens();
      drawInputCanvas();
    });

    el('lens-apply-btn').addEventListener('click', () => {
      if (lensCorners.length !== 4 || nRows < 2 || nCols < 2) return;
      // Compute all intersection positions via lens model
      inputDots = [];
      for (let r = 0; r < nRows; r++) {
        for (let c = 0; c < nCols; c++) {
          const p = lensModelPoint(r, c);
          inputDots.push({ x: p.x, y: p.y, r, c });
        }
      }
      pipelineDots = inputDots.map(d => ({ x: d.x, y: d.y, r: d.r, c: d.c }));
      // Pin every 4th intersection + all edge intersections
      pinnedDots.clear();
      for (let r = 0; r < nRows; r++) {
        for (let c = 0; c < nCols; c++) {
          const isEdge = r === 0 || r === nRows - 1 || c === 0 || c === nCols - 1;
          const isSparse = r % 4 === 0 && c % 4 === 0;
          if (isEdge || isSparse) pinnedDots.add(r * nCols + c);
        }
      }
      setActiveTool('fit', { refit: false });
      refitAndRedraw({ reclassify: true });
      el('status').textContent = 'Lens → Fit: grid applied, pinned sparse subset. Fine-tune with TPS.';
    });

    el('pin-corners-btn').addEventListener('click', () => {
      if (!inputDots || nRows === 0 || nCols === 0) return;
      pinCorners();
      tabZoomIndex = -1;
      setActiveTool('fit');
    });

    el('reset-dots-btn').addEventListener('click', () => {
      if (!inputDots) return;
      if (pipelineDots) {
        for (let i = 0; i < inputDots.length; i++) {
          inputDots[i].x = pipelineDots[i].x;
          inputDots[i].y = pipelineDots[i].y;
        }
      }
      pinnedDots.clear();
      lastFit = null;
      tabZoomIndex = -1;
      setActiveTool('move');
      runPipeline({ forcedGrid: inputDots });
    });

    // ── Dumbbells toggle ─────────────────────────────────────────────────────
    el('toggle-dumbbells').addEventListener('click', () => {
      showDumbbells = !showDumbbells;
      el('toggle-dumbbells').classList.toggle('active', showDumbbells);
      drawInputCanvas();
    });

    el('toggle-ellipses').addEventListener('click', () => {
      showEllipses = !showEllipses;
      el('toggle-ellipses').classList.toggle('active', showEllipses);
      el('thickness-param').style.display = showEllipses ? '' : 'none';
      drawInputCanvas();
    });

    el('stone-thickness').addEventListener('input', () => {
      stoneThickness = parseFloat(el('stone-thickness').value);
      el('stone-thickness-val').textContent = stoneThickness.toFixed(2);
      drawInputCanvas();
    });

    // Set tabZoomIndex so next Tab press lands on the given dot index
    function queueTabZoom(dotIdx) {
      const pinList = [...pinnedDots].sort((a, b) => a - b);
      const pos = pinList.indexOf(dotIdx);
      tabZoomIndex = pos >= 0 ? pos - 1 : -1;
    }

    // ── Tab zoom cycling ─────────────────────────────────────────────────────
    function zoomToPoint(ix, iy, scale = 4) {
      viewport.scale = scale;
      viewport.panX = canvasInput.width / 2 - ix * scale;
      viewport.panY = canvasInput.height / 2 - iy * scale;
      drawInputCanvas();
    }

    canvasInput.addEventListener('dblclick', e => {
      const { x, y } = screenToImage(e.clientX, e.clientY);
      lastFocusPoint = { x, y };
      zoomToPoint(x, y);
    });

    document.addEventListener('keydown', e => {
      // Ellipse editing shortcuts
      if (e.key === 'Escape' && selectedEllipseKey) {
        selectedEllipseKey = null;
        ellipseDragMode = null;
        drawInputCanvas();
        return;
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedEllipseKey && showEllipses) {
        // Reset overrides for selected ellipse
        delete ellipseOverrides[selectedEllipseKey];
        drawInputCanvas();
        return;
      }
      if (e.key === '+' || e.key === '=') {
        if (lastFocusPoint) zoomToPoint(lastFocusPoint.x, lastFocusPoint.y);
        return;
      }
      if (e.key === '-') {
        viewport = { scale: 1, panX: 0, panY: 0 };
        tabZoomIndex = -1;
        drawInputCanvas();
        return;
      }
      if (e.key !== 'Tab') return;
      e.preventDefault();

      // Build cycle list depending on active tool
      /** @type {{x: number, y: number}[]} */
      let cyclePoints = [];
      if (activeTool === 'lens') {
        for (const p of lensCorners) cyclePoints.push(p);
      } else {
        const pinList = [...pinnedDots].sort((a, b) => a - b);
        for (const idx of pinList) cyclePoints.push(inputDots[idx]);
      }
      if (cyclePoints.length === 0) return;

      // Advance or reverse; -1 = zoomed out
      const total = cyclePoints.length;
      if (e.shiftKey) {
        tabZoomIndex = tabZoomIndex <= -1 ? total - 1 : tabZoomIndex - 1;
      } else {
        tabZoomIndex++;
        if (tabZoomIndex >= total) tabZoomIndex = -1;
      }

      if (tabZoomIndex === -1) {
        viewport = { scale: 1, panX: 0, panY: 0 };
        drawInputCanvas();
      } else {
        const p = cyclePoints[tabZoomIndex];
        lastFocusPoint = { x: p.x, y: p.y };
        zoomToPoint(p.x, p.y);
      }
    });

    function pinCorners() {
      pinnedDots.clear();
      pinnedDots.add(0);
      pinnedDots.add(nCols - 1);
      pinnedDots.add((nRows - 1) * nCols);
      pinnedDots.add(nRows * nCols - 1);
    }

    // ── Dimension change → regenerate dots ──────────────────────────────────
    function onDimensionChange() {
      const newR = +el('board-rows').value || 0;
      const newC = +el('board-cols').value || 0;
      if (newR < 2 || newC < 2 || !sourceImage) return;
      nRows = newR;
      nCols = newC;

      // Generate uniform grid spanning board area or full image
      let x0, y0, x1, y1;
      if (lastRectCorners) {
        x0 = Math.min(...lastRectCorners.map(p => p.x));
        y0 = Math.min(...lastRectCorners.map(p => p.y));
        x1 = Math.max(...lastRectCorners.map(p => p.x));
        y1 = Math.max(...lastRectCorners.map(p => p.y));
      } else {
        const margin = 0.05;
        x0 = sourceW * margin; y0 = sourceH * margin;
        x1 = sourceW * (1 - margin); y1 = sourceH * (1 - margin);
      }

      inputDots = [];
      for (let r = 0; r < nRows; r++) {
        for (let c = 0; c < nCols; c++) {
          const fx = nCols > 1 ? c / (nCols - 1) : 0.5;
          const fy = nRows > 1 ? r / (nRows - 1) : 0.5;
          inputDots.push({ x: x0 + fx * (x1 - x0), y: y0 + fy * (y1 - y0), r, c });
        }
      }
      pipelineDots = inputDots.map(d => ({ x: d.x, y: d.y, r: d.r, c: d.c }));

      editableStones = Array.from({ length: nRows }, () => Array(nCols).fill('.'));
      tabZoomIndex = -1;
      pinCorners();
      setActiveTool('fit');
      drawBoard();
      updateMetrics();
      el('copy-fixture-btn').disabled = false;
    }

    function syncAutoDims() {
      const auto = el('auto-dims').checked;
      el('board-rows').disabled = auto;
      el('board-cols').disabled = auto;
      el('board-rows').style.opacity = auto ? '0.4' : '1';
      el('board-cols').style.opacity = auto ? '0.4' : '1';
      if (auto) {
        el('board-rows').value = '';
        el('board-cols').value = '';
      }
    }
    syncAutoDims();

    let dimRerunTimer = null;
    function scheduleDimRerun() {
      if (dimRerunTimer) clearTimeout(dimRerunTimer);
      dimRerunTimer = setTimeout(() => { dimRerunTimer = null; runPipeline(); }, 500);
    }

    el('auto-dims').addEventListener('change', () => {
      syncAutoDims();
      if (imageLoaded) scheduleDimRerun();
    });

    el('board-rows').addEventListener('input', onDimensionChange);
    el('board-cols').addEventListener('input', onDimensionChange);

    // ── Mouse interaction on input canvas ───────────────────────────────────
    let draggingDot = -1; // index of dot being dragged
    let clickedDot = -1;  // index of dot clicked (for pin toggle in fit mode)
    let clickedDotWasPinned = false; // was the dot already pinned before mousedown?
    let dragStart = { x: 0, y: 0 }; // image coords at drag start
    let dragDotStart = { x: 0, y: 0 }; // dot position at drag start
    let didDrag = false;
    let isPanning = false;
    let panStart = { x: 0, y: 0 };

    /** Find nearest lens corner handle within hit radius. Returns 'corner-N' or null. */
    function findLensHandle(ix, iy) {
      const hitR = Math.max(12, sourceW / 50) / viewport.scale;
      let best = null, bestDist = hitR;
      for (let i = 0; i < lensCorners.length; i++) {
        const d = Math.hypot(lensCorners[i].x - ix, lensCorners[i].y - iy);
        if (d < bestDist) { bestDist = d; best = `corner-${i}`; }
      }
      return best;
    }

    // Ellipse drag state
    let ellipseDragStart = { x: 0, y: 0 };
    let ellipseDragEllStart = null;  // snapshot of ellipse at drag start

    canvasInput.addEventListener('mousedown', e => {
      const { x, y } = screenToImage(e.clientX, e.clientY);

      // Ellipse editing intercepts when overlay is visible
      if (showEllipses) {
        const hit = hitTestEllipses(x, y);
        if (hit) {
          if (hit.mode === 'body') {
            // Select this ellipse
            selectedEllipseKey = hit.key;
            ellipseDragMode = null;
            drawInputCanvas();
          } else {
            // Start dragging a handle
            selectedEllipseKey = hit.key;
            ellipseDragMode = hit.mode;
            ellipseDragStart = { x, y };
            const eff = getEffectiveEllipses();
            ellipseDragEllStart = eff ? { ...eff[hit.key] } : null;
            didDrag = false;
          }
          e.preventDefault();
          return;
        }
        // Click on empty space deselects
        if (selectedEllipseKey) {
          selectedEllipseKey = null;
          ellipseDragMode = null;
          drawInputCanvas();
          e.preventDefault();
          return;
        }
      }

      if (activeTool === 'lens') {
        // Try to grab an existing handle
        const handle = findLensHandle(x, y);
        if (handle) {
          lensDragging = handle;
          dragStart = { x, y };
          const idx = +handle.split('-')[1];
          dragDotStart = { x: lensCorners[idx].x, y: lensCorners[idx].y };
          didDrag = false;
          e.preventDefault();
          return;
        }
        // Otherwise pan
        isPanning = true;
        panStart = { x: e.clientX, y: e.clientY };
        e.preventDefault();
        return;
      }

      const dotIdx = findNearestDot(x, y);

      if (dotIdx >= 0) {
        if (activeTool === 'move') {
          // Move mode: start dragging any dot
          draggingDot = dotIdx;
          clickedDot = -1;
          dragStart = { x, y };
          dragDotStart = { x: inputDots[dotIdx].x, y: inputDots[dotIdx].y };
          didDrag = false;
          e.preventDefault();
        } else {
          // Fit mode: pin unpinned dots immediately, start drag
          clickedDotWasPinned = pinnedDots.has(dotIdx);
          clickedDot = dotIdx;
          didDrag = false;
          if (!clickedDotWasPinned) {
            pinnedDots.add(dotIdx);
            queueTabZoom(dotIdx);
            refitAndRedraw();
          }
          draggingDot = dotIdx;
          dragStart = { x, y };
          dragDotStart = { x: inputDots[dotIdx].x, y: inputDots[dotIdx].y };
          e.preventDefault();
        }
      } else {
        // Empty space: pan
        isPanning = true;
        panStart = { x: e.clientX, y: e.clientY };
        e.preventDefault();
      }
    });

    window.addEventListener('mousemove', e => {
      // Ellipse handle dragging
      if (ellipseDragMode && selectedEllipseKey && ellipseDragEllStart) {
        const { x, y } = screenToImage(e.clientX, e.clientY);
        const dx = x - ellipseDragStart.x;
        const dy = y - ellipseDragStart.y;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) didDrag = true;

        if (!ellipseOverrides[selectedEllipseKey]) {
          ellipseOverrides[selectedEllipseKey] = {};
        }
        const ov = ellipseOverrides[selectedEllipseKey];
        const ell = ellipseDragEllStart;

        if (ellipseDragMode === 'center') {
          // Move: direct translation
          const base = computeStoneEllipses(stoneThickness);
          if (base && base[selectedEllipseKey]) {
            ov.dcx = (ell.cx + dx) - base[selectedEllipseKey].cx;
            ov.dcy = (ell.cy + dy) - base[selectedEllipseKey].cy;
          }
        } else {
          // Axis handle: decompose motion into radial (resize) and tangential (rotate)
          const rad = ell.angle * Math.PI / 180;
          const cosA = Math.cos(rad), sinA = Math.sin(rad);

          // Direction from center to handle
          let hx, hy;
          if (ellipseDragMode === 'majorA') { hx = cosA; hy = sinA; }
          else if (ellipseDragMode === 'majorB') { hx = -cosA; hy = -sinA; }
          else if (ellipseDragMode === 'minorA') { hx = -sinA; hy = cosA; }
          else /* minorB */ { hx = sinA; hy = -cosA; }

          // Radial component: projection of drag onto handle direction
          const radialDelta = dx * hx + dy * hy;
          // Tangential component: perpendicular to handle direction
          const tangDelta = dx * (-hy) + dy * hx;

          const base = computeStoneEllipses(stoneThickness);
          if (base && base[selectedEllipseKey]) {
            const baseEll = base[selectedEllipseKey];
            if (ellipseDragMode === 'majorA' || ellipseDragMode === 'majorB') {
              ov.da = Math.max(ell.a + radialDelta, 3) - baseEll.a;
            } else {
              ov.db = Math.max(ell.b + radialDelta, 3) - baseEll.b;
            }
            // Rotation from tangential movement
            const armLen = (ellipseDragMode === 'majorA' || ellipseDragMode === 'majorB') ? ell.a : ell.b;
            if (armLen > 1) {
              const angleDelta = Math.atan2(tangDelta, armLen) * 180 / Math.PI;
              ov.dangle = (ell.angle + angleDelta) - baseEll.angle;
            }
          }
        }
        drawInputCanvas();
        return;
      }

      if (lensDragging) {
        const { x, y } = screenToImage(e.clientX, e.clientY);
        const dx = x - dragStart.x, dy = y - dragStart.y;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) didDrag = true;
        const i = +lensDragging.split('-')[1];
        lensCorners[i] = { x: dragDotStart.x + dx, y: dragDotStart.y + dy };
        drawInputCanvas();
        return;
      }
      if (draggingDot >= 0) {
        const { x, y } = screenToImage(e.clientX, e.clientY);
        const dx = x - dragStart.x;
        const dy = y - dragStart.y;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) didDrag = true;
        inputDots[draggingDot].x = dragDotStart.x + dx;
        inputDots[draggingDot].y = dragDotStart.y + dy;
        if (activeTool === 'fit') refitAndRedraw();
        else drawInputCanvas();
      } else if (isPanning) {
        const rect = canvasInput.getBoundingClientRect();
        const cssToCanvas = canvasInput.width / rect.width;
        const dx = (e.clientX - panStart.x) * cssToCanvas;
        const dy = (e.clientY - panStart.y) * cssToCanvas;
        viewport.panX += dx;
        viewport.panY += dy;
        panStart = { x: e.clientX, y: e.clientY };
        drawInputCanvas();
      }
    });

    window.addEventListener('mouseup', e => {
      if (ellipseDragMode) {
        ellipseDragMode = null;
        ellipseDragEllStart = null;
        return;
      }
      if (lensDragging) {
        const i = +lensDragging.split('-')[1];
        lastFocusPoint = { x: lensCorners[i].x, y: lensCorners[i].y };
        lensDragging = null;
        return;
      }
      if (draggingDot >= 0) {
        lastFocusPoint = { x: inputDots[draggingDot].x, y: inputDots[draggingDot].y };
        if (didDrag) runPipeline({ forcedGrid: inputDots });
      }
      draggingDot = -1;
      // Fit mode: click without drag
      if (clickedDot >= 0 && activeTool === 'fit' && !didDrag) {
        if (clickedDotWasPinned) {
          // Unpin
          pinnedDots.delete(clickedDot);
          tabZoomIndex = -1;
        }
        // Pin or unpin changed the fit — reclassify
        refitAndRedraw({ reclassify: true });
      }
      clickedDot = -1;
      if (isPanning) {
        isPanning = false;
      }
    });

    // ── Mouse wheel: scroll to pan, pinch (ctrl+wheel) to zoom ─────────────
    canvasInput.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = canvasInput.getBoundingClientRect();
      const cssToCanvas = canvasInput.width / rect.width;

      if (e.ctrlKey) {
        // Pinch-to-zoom (trackpad) or ctrl+scroll (mouse)
        const zoomFactor = e.deltaY < 0 ? 1.06 : 1 / 1.06;
        const newScale = Math.min(10, Math.max(0.5, viewport.scale * zoomFactor));
        const { x: ix, y: iy } = screenToImage(e.clientX, e.clientY);
        const cx = (e.clientX - rect.left) * cssToCanvas;
        const cy = (e.clientY - rect.top) * cssToCanvas;
        viewport.scale = newScale;
        viewport.panX = cx - ix * newScale;
        viewport.panY = cy - iy * newScale;
      } else {
        // Two-finger scroll → pan
        viewport.panX -= e.deltaX * cssToCanvas;
        viewport.panY -= e.deltaY * cssToCanvas;
      }
      drawInputCanvas();
    }, { passive: false });

    // ── Touch interaction on input canvas ────────────────────────────────────
    let touchDragDot = -1;
    let touchDragStart = null; // image coords
    let touchDotStart = null;  // dot position at start
    let touchDidDrag = false;
    let touchDotWasPinned = false;
    let touchPanStart = null;
    let pinchStart = null; // { dist, midX, midY, scale, panX, panY }

    function touchDist(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }
    function touchMid(t1, t2) {
      return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
    }

    canvasInput.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        const t = e.touches[0];
        const { x, y } = screenToImage(t.clientX, t.clientY);

        // Lens mode touch handling
        if (activeTool === 'lens') {
          const handle = findLensHandle(x, y);
          if (handle) {
            lensDragging = handle;
            touchDragStart = { x, y };
            touchDidDrag = false;
            const idx = +handle.split('-')[1];
            touchDotStart = { x: lensCorners[idx].x, y: lensCorners[idx].y };
            e.preventDefault();
            return;
          }
          touchPanStart = { x: t.clientX, y: t.clientY };
          e.preventDefault();
          return;
        }

        const dotIdx = findNearestDot(x, y);
        if (dotIdx >= 0) {
          touchDotWasPinned = pinnedDots.has(dotIdx);
          touchDragDot = dotIdx;
          touchDidDrag = false;
          // In fit mode, auto-pin unpinned dots
          if (activeTool === 'fit' && !touchDotWasPinned) {
            pinnedDots.add(dotIdx);
            queueTabZoom(dotIdx);
            refitAndRedraw();
          }
          if (activeTool === 'move' || activeTool === 'fit') {
            touchDragStart = { x, y };
            touchDotStart = { x: inputDots[dotIdx].x, y: inputDots[dotIdx].y };
          }
          e.preventDefault();
        } else {
          touchPanStart = { x: t.clientX, y: t.clientY };
          e.preventDefault();
        }
      } else if (e.touches.length === 2) {
        touchDragDot = -1;
        touchPanStart = null;
        const d = touchDist(e.touches[0], e.touches[1]);
        const mid = touchMid(e.touches[0], e.touches[1]);
        pinchStart = { dist: d, midX: mid.x, midY: mid.y, scale: viewport.scale, panX: viewport.panX, panY: viewport.panY };
        e.preventDefault();
      }
    }, { passive: false });

    canvasInput.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && lensDragging && touchDotStart) {
        const t = e.touches[0];
        const { x, y } = screenToImage(t.clientX, t.clientY);
        const dx = x - touchDragStart.x, dy = y - touchDragStart.y;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) touchDidDrag = true;
        const i = +lensDragging.split('-')[1];
        lensCorners[i] = { x: touchDotStart.x + dx, y: touchDotStart.y + dy };
        drawInputCanvas();
        e.preventDefault();
      } else if (e.touches.length === 1 && touchDragDot >= 0 && touchDotStart) {
        const t = e.touches[0];
        const { x, y } = screenToImage(t.clientX, t.clientY);
        const dx = x - touchDragStart.x;
        const dy = y - touchDragStart.y;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) touchDidDrag = true;
        inputDots[touchDragDot].x = touchDotStart.x + dx;
        inputDots[touchDragDot].y = touchDotStart.y + dy;
        if (activeTool === 'fit') refitAndRedraw();
        else drawInputCanvas();
        e.preventDefault();
      } else if (e.touches.length === 1 && touchPanStart) {
        const t = e.touches[0];
        const rect = canvasInput.getBoundingClientRect();
        const cssToCanvas = canvasInput.width / rect.width;
        const dx = (t.clientX - touchPanStart.x) * cssToCanvas;
        const dy = (t.clientY - touchPanStart.y) * cssToCanvas;
        viewport.panX += dx;
        viewport.panY += dy;
        touchPanStart = { x: t.clientX, y: t.clientY };
        drawInputCanvas();
        e.preventDefault();
      } else if (e.touches.length === 2 && pinchStart) {
        const d = touchDist(e.touches[0], e.touches[1]);
        const mid = touchMid(e.touches[0], e.touches[1]);
        const ratio = d / pinchStart.dist;
        const newScale = Math.min(10, Math.max(0.5, pinchStart.scale * ratio));

        const rect = canvasInput.getBoundingClientRect();
        const cssToCanvas = canvasInput.width / rect.width;
        const midCX = (mid.x - rect.left) * cssToCanvas;
        const midCY = (mid.y - rect.top) * cssToCanvas;

        const origMidCX = (pinchStart.midX - rect.left) * cssToCanvas;
        const origMidCY = (pinchStart.midY - rect.top) * cssToCanvas;
        const ix = (origMidCX - pinchStart.panX) / pinchStart.scale;
        const iy = (origMidCY - pinchStart.panY) / pinchStart.scale;

        viewport.scale = newScale;
        viewport.panX = midCX - ix * newScale;
        viewport.panY = midCY - iy * newScale;
        drawInputCanvas();
        e.preventDefault();
      }
    }, { passive: false });

    canvasInput.addEventListener('touchend', e => {
      if (e.touches.length < 2) pinchStart = null;
      if (e.touches.length === 0) {
        if (lensDragging) { lensDragging = null; touchDragStart = null; touchDotStart = null; return; }
        if (touchDragDot >= 0 && touchDidDrag) runPipeline({ forcedGrid: inputDots });
        if (touchDragDot >= 0 && activeTool === 'fit' && !touchDidDrag) {
          if (touchDotWasPinned) {
            pinnedDots.delete(touchDragDot);
            tabZoomIndex = -1;
          }
          refitAndRedraw({ reclassify: true });
        }
        touchDragDot = -1;
        touchDragStart = null;
        touchDotStart = null;
        touchPanStart = null;
      }
    });

    // ── Run pipeline ────────────────────────────────────────────────────────
    el('run-btn').addEventListener('click', runPipeline);

    function runPipeline({ forcedGrid } = {}) {
      if (!imageLoaded) return;
      // forcedGrid path requires a previous full pipeline run
      if (forcedGrid && !lastRectCorners) return;

      const userRows = +el('board-rows').value || 0;
      const userCols = +el('board-cols').value || 0;
      const forceRows = userRows || 0;
      const forceCols = userCols || 0;
      const hintN = Math.max(forceRows, forceCols) || 0;
      const scope = new MatScope();
      const mat = m => scope.track(m);

      try {
        el('status').textContent = forcedGrid ? 'Reclassifying…' : 'Running pipeline…';

        // Draw clean source image (no overlays) for cv.imread
        if (sourceImage) {
          ctxInput.save();
          ctxInput.setTransform(1, 0, 0, 1, 0, 0);
          ctxInput.clearRect(0, 0, canvasInput.width, canvasInput.height);
          ctxInput.drawImage(sourceImage, 0, 0, sourceW, sourceH);
          ctxInput.restore();
        }
        const src   = mat(cv.imread(canvasInput));
        // Restore overlays after reading
        drawInputCanvas();

        let classResult, pipeResult;

        if (forcedGrid) {
          // forcedGrid path: rectify + classify using saved corners
          const rectCorners = lastRectCorners;
          const rectW = lastRectW;
          const rectH = lastRectH;
          const rectified = mat(rectifyBoard(src, rectCorners, rectW, rectH));
          const detection = buildDetectionFromGrid(forcedGrid, rectCorners, rectW, rectH);

          nRows = detection.rowPos.length;
          nCols = detection.colPos.length;

          const rectGrayRaw = mat(new cv.Mat());
          cv.cvtColor(rectified, rectGrayRaw, cv.COLOR_RGBA2GRAY);
          const rectGray = mat(enhanceGray(rectGrayRaw, false));

          classResult = classifyStones(rectGray, detection.rowPos, detection.colPos,
                                       detection.step, detection.rawCircles,
                                       detection.intersections, true);
        } else {
          // Run shared TPS pipeline
          const grayMat = mat(new cv.Mat());
          cv.cvtColor(src, grayMat, cv.COLOR_RGBA2GRAY);
          pipeResult = sharedRunPipeline(
            { colorMat: src, grayMat, width: src.cols, height: src.rows },
            { hintN, forceRows, forceCols });
          if (!pipeResult) {
            // Pipeline failed, but a fixture JSON may already exist for this image.
            // Set fallback rect corners (full image) so forced-grid reclassification
            // can still work if the fixture has intersection data.
            lastRectCorners = [
              { x: 0, y: 0 }, { x: src.cols - 1, y: 0 },
              { x: src.cols - 1, y: src.rows - 1 }, { x: 0, y: src.rows - 1 },
            ];
            lastRectW = src.cols;
            lastRectH = src.rows;
            el('status').textContent = 'Pipeline failed — trying to load fixture JSON…';
            tryLoadFixture();
            return;
          }
          nRows = pipeResult.nRows;
          nCols = pipeResult.nCols;
          lastRectCorners = pipeResult.rectCorners;
          lastRectW = pipeResult.rectW;
          lastRectH = pipeResult.rectH;

          // Build classResult-compatible stones from grid
          classResult = { stones: [] };
          for (let r = 0; r < nRows; r++) {
            for (let c = 0; c < nCols; c++) {
              const color = pipeResult.grid[r][c];
              if (color !== '.') classResult.stones.push({ r, c, color });
            }
          }
        }

        el('detected-dims').textContent = `(detected ${nRows}×${nCols})`;

        // Initialize editable stones (non-square aware)
        editableStones = Array.from({ length: nRows }, () => Array(nCols).fill('.'));
        for (const s of classResult.stones) {
          if (s.r < nRows && s.c < nCols) {
            editableStones[s.r][s.c] = s.color;
          }
        }

        if (forcedGrid) {
          // Don't overwrite inputDots or pipelineDots — user is dragging
          drawBoard();
          drawInputCanvas();
          el('status').textContent = `Reclassified ${nRows}×${nCols} board from adjusted grid.`;
          updateMetrics();
        } else {
          // detectedIntersections from shared pipeline are in original image coords
          inputDots = pipeResult.detectedIntersections.map(d => ({
            x: d.x, y: d.y, r: d.r, c: d.c,
          }));
          // Snapshot for Reset
          pipelineDots = inputDots.map(d => ({ x: d.x, y: d.y, r: d.r, c: d.c }));

          // Auto-pin corners, stay in Move mode
          pinCorners();
          setActiveTool('move');

          drawBoard();
          el('copy-fixture-btn').disabled = false;
          el('status').textContent = `Detected ${nRows}×${nCols} board. Click to edit stones. Drag dots on input.`;
          updateMetrics();

          // Try to auto-load matching fixture JSON
          tryLoadFixture();
        }

      } catch (err) {
        el('status').textContent = 'Error: ' + err.message;
        console.error(err);
      } finally {
        scope.release();
      }
    }

    function tryLoadFixture() {
      if (!currentFilename) return;
      const base = currentFilename.replace(/\.[^.]+$/, '');
      const t = Date.now();
      // Try fixtures/real/ first (real board photos), then fixtures/ (diagrams).
      // Paths are absolute to avoid ambiguity under the /kifu/ Vite base.
      const candidates = [
        `/kifu/fixtures/real/${base}.fixture.json`,
        `/kifu/fixtures/${base}.fixture.json`,
      ];
      const tryNext = (i) => {
        if (i >= candidates.length) return;
        fetch(`${candidates[i]}?t=${t}`).then(r => {
          if (!r.ok) { tryNext(i + 1); return; }
          return r.json();
        }).then(fixture => {
          if (!fixture) return;
          applyFixture(fixture);
          el('status').textContent = `Loaded fixture for ${currentFilename}. Click to edit stones.`;
        }).catch(() => tryNext(i + 1));
      };
      tryNext(0);
    }

    // ── Draw interactive board ──────────────────────────────────────────────
    function drawBoard() {
      if (!editableStones) return;
      const R = editableStones.length;
      const C = editableStones[0].length;
      const cellSize = 28;
      const pad = Math.round(cellSize * 0.8);
      const w = pad * 2 + (C - 1) * cellSize;
      const h = pad * 2 + (R - 1) * cellSize;
      boardCanvas.width = w;
      boardCanvas.height = h;

      // Background
      ctxBoard.fillStyle = '#d4a44a';
      ctxBoard.fillRect(0, 0, w, h);

      // Grid lines
      ctxBoard.strokeStyle = '#333';
      ctxBoard.lineWidth = 1;
      for (let r = 0; r < R; r++) {
        const y = pad + r * cellSize;
        ctxBoard.beginPath();
        ctxBoard.moveTo(pad, y); ctxBoard.lineTo(pad + (C-1) * cellSize, y);
        ctxBoard.stroke();
      }
      for (let c = 0; c < C; c++) {
        const x = pad + c * cellSize;
        ctxBoard.beginPath();
        ctxBoard.moveTo(x, pad); ctxBoard.lineTo(x, pad + (R-1) * cellSize);
        ctxBoard.stroke();
      }

      // Star points (hoshi) — only for standard square sizes
      if (R === C) {
        const N = R;
        const hoshi = N === 19 ? [3,9,15] : N === 13 ? [3,6,9] : N === 9 ? [2,4,6] : [];
        ctxBoard.fillStyle = '#333';
        for (const hr of hoshi) {
          for (const hc of hoshi) {
            ctxBoard.beginPath();
            ctxBoard.arc(pad + hc * cellSize, pad + hr * cellSize, 3, 0, 2 * Math.PI);
            ctxBoard.fill();
          }
        }
      }

      // Stones
      const stoneR = Math.floor(cellSize * 0.44);
      for (let r = 0; r < R; r++) {
        for (let c = 0; c < C; c++) {
          const color = editableStones[r][c];
          if (color === '.') continue;
          const cx = pad + c * cellSize;
          const cy = pad + r * cellSize;
          ctxBoard.beginPath();
          ctxBoard.arc(cx, cy, stoneR, 0, 2 * Math.PI);
          if (color === 'B') {
            ctxBoard.fillStyle = '#111';
            ctxBoard.strokeStyle = '#444';
          } else {
            ctxBoard.fillStyle = '#f0f0f0';
            ctxBoard.strokeStyle = '#333';
          }
          ctxBoard.fill();
          ctxBoard.lineWidth = 1.5;
          ctxBoard.stroke();
        }
      }

      // Small dots for empty intersections
      ctxBoard.fillStyle = 'rgba(0,0,0,0.15)';
      for (let r = 0; r < R; r++) {
        for (let c = 0; c < C; c++) {
          if (editableStones[r][c] !== '.') continue;
          ctxBoard.beginPath();
          ctxBoard.arc(pad + c * cellSize, pad + r * cellSize, 2, 0, 2 * Math.PI);
          ctxBoard.fill();
        }
      }
    }

    // ── Click to cycle: empty → B → W → empty ──────────────────────────────
    boardCanvas.addEventListener('click', e => {
      if (!editableStones) return;
      const R = editableStones.length;
      const C = editableStones[0].length;
      const cellSize = 28;
      const pad = Math.round(cellSize * 0.8);
      const rect = boardCanvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (boardCanvas.width / rect.width);
      const my = (e.clientY - rect.top) * (boardCanvas.height / rect.height);
      const c = Math.round((mx - pad) / cellSize);
      const r = Math.round((my - pad) / cellSize);
      if (r < 0 || r >= R || c < 0 || c >= C) return;

      const cur = editableStones[r][c];
      editableStones[r][c] = cur === '.' ? 'B' : cur === 'B' ? 'W' : '.';
      drawBoard();
    });

    // ── Build fixture JSON ──────────────────────────────────────────────────
    function buildFixtureJSON() {
      if (!editableStones) return null;
      const R = editableStones.length;
      const C = editableStones[0].length;

      // Use lens model for intersections when lens corners are active,
      // otherwise fall back to inputDots (which may have been dragged)
      let origIntersections = null;
      if (lensCorners.length === 4 && R >= 2 && C >= 2) {
        origIntersections = [];
        for (let r = 0; r < R; r++) {
          for (let c = 0; c < C; c++) {
            const p = lensModelPoint(r, c);
            origIntersections.push([
              Math.round(p.x * 10) / 10,
              Math.round(p.y * 10) / 10,
            ]);
          }
        }
      } else if (inputDots) {
        origIntersections = inputDots.map(d => [
          Math.round(d.x * 10) / 10,
          Math.round(d.y * 10) / 10,
        ]);
      }

      // Build stones array (non-empty only)
      const stones = [];
      for (let r = 0; r < R; r++) {
        for (let c = 0; c < C; c++) {
          if (editableStones[r][c] !== '.') {
            stones.push([r, c, editableStones[r][c]]);
          }
        }
      }

      // Use the probed project-root-relative path (e.g. fixtures/real/IMG_1395.JPG).
      // Falls back to best-guess if resolveImagePath hasn't resolved yet.
      const image = currentImagePath || `fixtures/real/${currentFilename}`;

      const fixture = { image, boardRows: R, boardCols: C, stones };
      if (origIntersections) fixture.intersections = origIntersections;
      if (lensCorners.length === 4) {
        fixture.boardCorners = lensCorners.map(p => [
          Math.round(p.x * 10) / 10,
          Math.round(p.y * 10) / 10,
        ]);
        // Derive stone ellipses from homography + thickness, with manual overrides
        const ellipses = getEffectiveEllipses();
        if (ellipses && Object.keys(ellipses).length > 0) {
          fixture.stoneThickness = Math.round(stoneThickness * 100) / 100;
          // Round values for JSON
          const rounded = {};
          for (const [key, ell] of Object.entries(ellipses)) {
            rounded[key] = {
              cx: Math.round(ell.cx * 10) / 10,
              cy: Math.round(ell.cy * 10) / 10,
              a: Math.round(ell.a * 10) / 10,
              b: Math.round(ell.b * 10) / 10,
              angle: Math.round(ell.angle * 10) / 10,
            };
          }
          fixture.stoneEllipses = rounded;
          // Store overrides separately so they can be restored
          if (Object.keys(ellipseOverrides).length > 0) {
            fixture.ellipseOverrides = ellipseOverrides;
          }
        }
      }
      return fixture;
    }

    // ── Copy fixture ────────────────────────────────────────────────────────
    el('copy-fixture-btn').addEventListener('click', () => {
      const fixture = buildFixtureJSON();
      if (!fixture) return;
      const json = JSON.stringify(fixture, null, 2);
      el('fixture-out').textContent = json;
      el('fixture-out').hidden = false;
      navigator.clipboard.writeText(json).then(() => {
        const btn = el('copy-fixture-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy Fixture'; }, 2000);
      });
    });

    // ── Apply fixture ─────────────────────────────────────────────────────
    function applyFixture(fixture) {
      const R = fixture.boardRows || fixture.boardSize;
      const C = fixture.boardCols || fixture.boardSize;
      if (!R || !C || !fixture.stones) return false;

      nRows = R; nCols = C;
      el('board-rows').value = R;
      el('board-cols').value = C;
      el('auto-dims').checked = false;
      syncAutoDims();

      editableStones = Array.from({ length: R }, () => Array(C).fill('.'));
      for (const [r, c, color] of fixture.stones) {
        if (r < R && c < C) editableStones[r][c] = color;
      }

      if (fixture.intersections) {
        // Rebuild inputDots from fixture intersections;
        // keep pipelineDots as the pipeline's original detection
        // so dumbbells and metrics show the difference
        inputDots = fixture.intersections.map((pt, i) => ({
          x: pt[0], y: pt[1],
          r: Math.floor(i / C),
          c: i % C,
        }));
        pinCorners();
        setActiveTool('move');
      }

      // Restore lens state if present
      if (fixture.boardCorners && fixture.boardCorners.length === 4) {
        lensCorners = fixture.boardCorners.map(p => ({ x: p[0], y: p[1] }));
        setActiveTool('lens');
      }

      // Restore stone thickness if present
      if (fixture.stoneThickness != null) {
        stoneThickness = fixture.stoneThickness;
        el('stone-thickness').value = stoneThickness;
        el('stone-thickness-val').textContent = stoneThickness.toFixed(2);
      }

      // Restore ellipse overrides if present
      ellipseOverrides = fixture.ellipseOverrides || {};
      selectedEllipseKey = null;

      drawBoard();
      drawInputCanvas();
      updateMetrics();
      el('copy-fixture-btn').disabled = false;
      return true;
    }

    // ── Paste fixture ───────────────────────────────────────────────────────
    el('paste-fixture-btn').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        const fixture = JSON.parse(text);
        if (!applyFixture(fixture)) {
          el('status').textContent = 'Invalid fixture JSON.';
          return;
        }
        el('status').textContent = `Pasted fixture: ${nRows}×${nCols}, ${fixture.stones.length} stones. Click to edit.`;
        el('fixture-out').textContent = text;
        el('fixture-out').hidden = false;
      } catch (err) {
        el('status').textContent = 'Paste failed: ' + err.message;
      }
    });

    // ── Drag & drop ─────────────────────────────────────────────────────────
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault();
      const file = [...e.dataTransfer.items || []]
        .find(i => i.kind === 'file' && i.type.startsWith('image/'))
        ?.getAsFile()
        ?? [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
      if (file) loadImage(file, { autoRun: true });
    });
  </script>
</body>
</html>
